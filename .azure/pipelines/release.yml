name: $(Date:yyyyMMdd).$(Rev:r)
variables:
  - name: BuildConfiguration
    value: Release
  - name: BuildNumber
    value: $[counter('versioncounter', 11128)]
  - name: Codeql.Enabled
    value: true
  - name: IsTargetMultiFramework
    value: true
  - name: LocalFeed
    value: $(UserProfile)\localfeed
  - name: EmulatorContainerRepository
    value: signalr/signalr-emulator
  - name: EmulatorPackageBaseAddress
    value: https://api.nuget.org/v3-flatcontainer
  - name: EmulatorPackageFeed
    value: https://api.nuget.org/v3/index.json
  - name: EmulatorPackageVersionsUrl
    value: https://api.nuget.org/v3-flatcontainer/microsoft.azure.signalr.emulator/index.json
  - name: MSBuildProperties
    value: Configuration=$(BuildConfiguration);BuildNumber=$(BuildNumber);VersionSuffix=$(VersionSuffix);IsTargetMultiFramework=$(IsTargetMultiFramework);SignType=$(SignType);IsFinalBuild=${{parameters.isFinalBuild}}
  - name: SignType
    value: real
  - name: TeamName
    value: Azure SignalR Team
  - name: VersionSuffix
    value: preview1-$(BuildNumber)
parameters:
  - name: isFinalBuild
    type: boolean
    default: false
  - name: releaseEmulator
    type: boolean
    default: false
  - name: releaseEmulatorContainer
    type: boolean
    default: false
  - name: emulatorPackageVersion
    type: string
    default: ''
  - name: releaseSDKCore
    type: boolean
    default: false
  - name: releaseServerlessProtocol
    type: boolean
    default: false
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/dev
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - src
  batch: true
pr: none
schedules:
  - cron: "0 8 * * 1"
    displayName: Sync released emulator container
    branches:
      include:
        - dev
    always: true
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      os: windows
      name: VSEngSS-MicroBuild2022-1ES
    customBuildTags:
      - MigrationTooling-mseng-VSJava-8484-Tool
    sdl:
      eslint:
        enabled: false
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    stages:
      - stage: Stage
        condition: and(succeeded(), ne(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.releaseEmulatorContainer }}', 'false'))
        jobs:
          - job: Phase_1
            displayName: Phase 1
            cancelTimeoutInMinutes: 1
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: Artifact
                  targetPath: artifacts
                  displayName: Publish nupkg to artifacts
                - output: nuget
                  displayName: Push packages to azure-signalr-dev feed
                  nuGetFeedType: external
                  packagesToPush: artifacts/**/*.nupkg;artifacts/**/*.snupkg
                  packageParentPath: artifacts
                  publishFeedCredentials: azure-signalr-dev
            steps:
              - script: git config --global core.longpaths true
                displayName: Enable git long paths
              - checkout: self
                clean: true
                submodules: true
                fetchDepth: 1
                fetchTags: false
                persistCredentials: true
              - ${{ if eq(parameters.isFinalBuild, true) }}:
                - script: |
                    echo ##vso[task.setvariable variable=VersionSuffix;]rtm
                  displayName: Set VersionSuffix to rtm if it is final build
                - script: |
                    echo $(VersionSuffix)
                    echo $(MSBuildProperties)
                  displayName: Print VersionSuffix and MSBuildProperties
              - task: UseDotNet@2
                displayName: Add 8.x
                inputs:
                  version: 8.x
                  performMultiLevelLookup: true
              - task: UseDotNet@2
                displayName: Add 10.x
                inputs:
                  version: 10.x
                  performMultiLevelLookup: true
              - task: NuGetAuthenticate@1
                displayName: Authenticate to Azure Artifacts (VSOnline-Internal)
              - ${{ if or( eq(parameters.isFinalBuild, false),  eq(parameters.releaseSDKCore, true)) }}:
                - task: DotNetCoreCLI@2
                  displayName: dotnet build AzureSignalR.sln
                  inputs:
                    projects: AzureSignalR.sln
                    arguments: /p:$(MSBuildProperties)
                - task: DotNetCoreCLI@2
                  displayName: dotnet test
                  inputs:
                    command: test
                    arguments: /p:$(MSBuildProperties)
                - task: DotNetCoreCLI@2
                  displayName: dotnet pack SDK Core
                  inputs:
                    command: pack
                    searchPatternPack: src/Microsoft*/*.csproj;!src\Microsoft.Azure.SignalR.Emulator\Microsoft.Azure.SignalR.Emulator.csproj;!src\Microsoft.Azure.SignalR.Serverless.Protocols\Microsoft.Azure.SignalR.Serverless.Protocols.csproj
                    outputDir: artifacts
                    includesymbols: true
                    includesource: true
                    buildProperties: $(MSBuildProperties)
                    verbosityPack: Normal
                - task: CmdLine@2
                  displayName: Clean Local Feed
                  inputs:
                    script: if exist $(LocalFeed)\ del /s /q $(LocalFeed)
                - task: NuGetCommand@2
                  displayName: Initialize Local Feed
                  inputs:
                    command: custom
                    arguments: init artifacts $(LocalFeed)
              - ${{ if or( eq(parameters.isFinalBuild, false),  eq(parameters.releaseEmulator, true)) }}:
                - task: DotNetCoreCLI@2
                  displayName: dotnet pack emulator when only dev or release emulator
                  inputs:
                    command: pack
                    searchPatternPack: src/Microsoft.Azure.SignalR.Emulator/Microsoft.Azure.SignalR.Emulator.csproj
                    outputDir: artifacts
                    includesymbols: true
                    includesource: true
                    buildProperties: $(MSBuildProperties)
                    verbosityPack: Normal
              - ${{ if or( eq(parameters.isFinalBuild, false),  eq(parameters.releaseServerlessProtocol, true)) }}:
                - task: DotNetCoreCLI@2
                  displayName: "dotnet pack serverless protocol when only dev or release "
                  inputs:
                    command: pack
                    searchPatternPack: src/Microsoft.Azure.SignalR.Serverless.Protocols/Microsoft.Azure.SignalR.Serverless.Protocols.csproj
                    outputDir: artifacts
                    includesymbols: true
                    includesource: true
                    buildProperties: $(MSBuildProperties)
                    verbosityPack: Normal
              - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
                displayName: "Manifest Generator "
                inputs:
                  BuildDropPath: artifacts
          - job: SDK_Partner_Release
            displayName: SDK Partner Release
            dependsOn: Phase_1
            steps:
              - download: current
                artifact: Artifact
                displayName: Download artifacts
              - ${{ if eq(parameters.isFinalBuild, true) }}:
                - task: AzurePowerShell@5
                  displayName: 'Install AzCopy (Windows)'
                  inputs:
                    azureSubscription: azuresdkpartnerdrops
                    ScriptType: InlineScript
                    azurePowerShellVersion: LatestVersion
                    pwsh: true
                    Inline: |
                      $ErrorActionPreference = 'Stop'
                      $zip = Join-Path $env:TEMP 'azcopy.zip'
                      $dir = Join-Path $env:TEMP 'azcopy'
                      $exe = Join-Path $dir 'azcopy.exe'
                      Invoke-WebRequest -Uri "https://aka.ms/downloadazcopy-v10-windows" -OutFile $zip
                      if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
                      Expand-Archive -Path $zip -DestinationPath $dir

                      # The zip contains a subfolder like azcopy_windows_amd64_*/azcopy.exe
                      $found = Get-ChildItem $dir -Recurse -Filter azcopy.exe | Select-Object -First 1
                      if (-not $found) { throw "azcopy.exe not found after extraction" }

                      $az = $found.FullName
                      Write-Host "AzCopy path: $az"
                      & $az --version

                      # Put it on PATH for subsequent steps in the same job
                      Write-Host "##vso[task.prependpath]$($found.DirectoryName)"
                - task: AzurePowerShell@5
                  displayName: 'Upload files to partner drop folder'
                  inputs:
                    azureSubscription: 'azuresdkpartnerdrops'
                    ScriptType: 'InlineScript'
                    azurePowerShellVersion: LatestVersion
                    pwsh: true
                    Inline: |
                      azcopy copy  "$(Pipeline.Workspace)/Artifact/*" "https://azuresdkpartnerdrops.blob.core.windows.net/drops/azure-signalr/dotnet/$(BuildNumber)/" --recursive --log-level=INFO
                  env:
                    AZCOPY_AUTO_LOGIN_TYPE: 'PSCRED'
      - stage: Emulator_Container_Release
        displayName: Sync Released Emulator Container
        dependsOn: []
        condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.releaseEmulatorContainer }}', 'true')))
        jobs:
          - job: Emulator_Container_Release
            displayName: Emulator Container Release
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1
                fetchTags: false
              - task: PowerShell@2
                displayName: Resolve released emulator package
                inputs:
                  targetType: inline
                  script: |
                    $index = Invoke-RestMethod -Uri "$(EmulatorPackageVersionsUrl)"
                    $requestedVersion = "$env:REQUESTED_EMULATOR_VERSION".Trim()

                    if ($requestedVersion) {
                      $version = $requestedVersion
                    } else {
                      $stableVersions = @(
                        $index.versions |
                          Where-Object { $_ -match '^\d+\.\d+\.\d+(?:\.\d+)?$' } |
                          Sort-Object { [version]$_ }
                      )
                      if ($stableVersions.Count -eq 0) {
                        throw "The released emulator feed contains no stable versions."
                      }
                      $version = $stableVersions[-1]
                    }

                    if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
                      throw "Invalid emulator package version '$version'."
                    }
                    if ($index.versions -notcontains $version) {
                      throw "Microsoft.Azure.SignalR.Emulator $version is not available from the released-package feed."
                    }

                    $normalizedVersion = $version.ToLowerInvariant()
                    $packageUri = "$(EmulatorPackageBaseAddress)/microsoft.azure.signalr.emulator/$normalizedVersion/microsoft.azure.signalr.emulator.$normalizedVersion.nupkg"
                    $response = Invoke-WebRequest -UseBasicParsing -Method Head -Uri $packageUri
                    if ($response.StatusCode -ne 200) {
                      throw "Microsoft.Azure.SignalR.Emulator $version is not yet downloadable from the released-package feed."
                    }

                    Write-Host "Using released Microsoft.Azure.SignalR.Emulator $version."
                    Write-Host "##vso[task.setvariable variable=EmulatorVersion]$version"
                env:
                  REQUESTED_EMULATOR_VERSION: ${{ parameters.emulatorPackageVersion }}
              # MAR syndicates this ACR repository to mcr.microsoft.com/signalr/signalr-emulator.
              - task: AzureCLI@2
                displayName: Publish emulator container to ACR
                inputs:
                  azureSubscription: $(EmulatorContainerRegistryServiceConnection)
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    $ErrorActionPreference = 'Stop'
                    az acr build `
                      --registry "$(EmulatorContainerRegistry)" `
                      --file Dockerfile `
                      --platform linux/amd64 `
                      --image "$(EmulatorContainerRepository):$(EmulatorVersion)" `
                      --image "$(EmulatorContainerRepository):latest" `
                      --build-arg "EMULATOR_FEED=$(EmulatorPackageFeed)" `
                      --build-arg "EMULATOR_VERSION=$(EmulatorVersion)" `
                      src/Microsoft.Azure.SignalR.Emulator
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to build and publish the emulator container."
                    }
