name: $(Date:yyyyMMdd).$(Rev:r)
variables:
  - name: BuildConfiguration
    value: Release
  - name: BuildNumber
    value: $[counter('versioncounter', 11128)]
  - name: Codeql.Enabled
    value: true
  - name: IsTargetMultiFramework
    value: true
  - name: LocalFeed
    value: $(UserProfile)\localfeed
  - name: MSBuildProperties
    value: Configuration=$(BuildConfiguration);BuildNumber=$(BuildNumber);VersionSuffix=$(VersionSuffix);IsTargetMultiFramework=$(IsTargetMultiFramework);SignType=$(SignType);IsFinalBuild=${{parameters.isFinalBuild}}
  - name: SignType
    value: real
  - name: TeamName
    value: Azure SignalR Team
  - name: VersionSuffix
    value: preview1-$(BuildNumber)
parameters:
  - name: isFinalBuild
    type: boolean
    default: false
  - name: releaseEmulator
    type: boolean
    default: false
  - name: releaseSDKCore
    type: boolean
    default: false
  - name: releaseServerlessProtocol
    type: boolean
    default: false
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/dev
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - src
  batch: true
pr: none
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      os: windows
      name: MSEngSS-MicroBuild2022-1ES
    customBuildTags:
      - MigrationTooling-mseng-VSJava-8484-Tool
    sdl:
      eslint:
        enabled: false
    settings:
      networkIsolationPolicy: Okay,GitHub,AzureFileCopy,NuGet,AzureStorage
    stages:
      - stage: Stage
        jobs:
          - job: SDK_Partner_Release
            displayName: SDK Partner Release
            steps:
              - download: current
                artifact: Artifact
                displayName: Download artifacts

              - ${{ if eq(parameters.isFinalBuild, true) }}:
                - task: AzurePowerShell@5
                  displayName: 'Install AzCopy (Windows)'
                  inputs:
                    azureSubscription: azuresdkpartnerdrops
                    ScriptType: InlineScript
                    azurePowerShellVersion: LatestVersion
                    pwsh: true
                    Inline: |
                      $ErrorActionPreference = 'Stop'
                      $zip = Join-Path $env:TEMP 'azcopy.zip'
                      $dir = Join-Path $env:TEMP 'azcopy'
                      Invoke-WebRequest -Uri "https://aka.ms/downloadazcopy-v10-windows" -OutFile $zip
                      if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
                      Expand-Archive -Path $zip -DestinationPath $dir

                      $found = Get-ChildItem $dir -Recurse -Filter azcopy.exe | Select-Object -First 1
                      if (-not $found) { throw "azcopy.exe not found after extraction" }

                      $az = $found.FullName
                      Write-Host "AzCopy path: $az"
                      & $az --version

                      Write-Host "##vso[task.prependpath]$($found.DirectoryName)"

                - pwsh: |
                    $ErrorActionPreference = 'Stop'
                    $artifactRoot = "$(Pipeline.Workspace)\Artifact"

                    if (-not (Test-Path $artifactRoot)) {
                      Write-Host "Artifact folder not found, creating: $artifactRoot"
                      New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
                    }

                    $testDir = Join-Path $artifactRoot "_azcopy_test"
                    New-Item -ItemType Directory -Force -Path $testDir | Out-Null

                    $testFile = Join-Path $testDir "hello-azcopy-$(Build.BuildId).txt"
                    "hello azcopy $(Get-Date -Format o)`r`nBuildNumber=$(BuildNumber)`r`nBuildId=$(Build.BuildId)" |
                      Set-Content -Path $testFile -Encoding utf8

                    Write-Host "Generated test file:"
                    Get-Item $testFile | Format-List FullName,Length,LastWriteTime
                  displayName: 'Generate AzCopy test file'

                - task: AzurePowerShell@5
                  displayName: 'Upload files to partner drop folder'
                  inputs:
                    azureSubscription: 'azuresdkpartnerdrops'
                    ScriptType: 'InlineScript'
                    azurePowerShellVersion: LatestVersion
                    pwsh: true
                    Inline: |
                      azcopy copy "$(Pipeline.Workspace)/Artifact/*" "https://azuresdkpartnerdrops.blob.core.windows.net/drops/azure-signalr/dotnet/$(BuildNumber)/" --recursive --log-level=INFO
                  env:
                    AZCOPY_AUTO_LOGIN_TYPE: 'PSCRED'