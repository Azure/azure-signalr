name: $(Date:yyyyMMdd).$(Rev:r)
variables:
  - group: npm-release
  - name: BuildConfiguration
    value: Release
  - name: BuildNumber
    value: $[counter('versioncounter', 11128)]
  - name: Codeql.Enabled
    value: true
  - name: IsTargetMultiFramework
    value: true
  - name: LocalFeed
    value: $(UserProfile)\localfeed
  - name: WindowsContainerImage
    value: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest
  - name: GIT_CONFIG_COUNT
    value: 1
  - name: GIT_CONFIG_KEY_0
    value: core.longpaths
  - name: GIT_CONFIG_VALUE_0
    value: true
  - name: MSBuildProperties
    value: Configuration=$(BuildConfiguration);BuildNumber=$(BuildNumber);VersionSuffix=$(VersionSuffix);IsTargetMultiFramework=$(IsTargetMultiFramework);SignType=$(SignType);IsFinalBuild=${{parameters.isFinalBuild}}
  - name: SignType
    value: real
  - name: TeamName
    value: Azure SignalR Team
  - name: VersionSuffix
    value: preview1-$(BuildNumber)
  # Replace these placeholders with the approved ESRP and Key Vault resources before a final release.
  - name: EsrpServiceConnection
    value: $(ESRP_SERVICE_CONNECTION)
  - name: EsrpAppRegistrationClientId
    value: $(ESRP_CLIENT_ID)
  - name: EsrpAppRegistrationTenantId
    value: $(ESRP_TENANT_ID)
  - name: EsrpKeyVaultName
    value: $(ESRP_KEY_VAULT_NAME)
  - name: EsrpAuthCertificateName
    value: $(ESRP_SIGN_CERT_NAME)
  - name: EsrpNuGetSigningCertificateName
    value: $(ESRP_SIGN_CERT_NAME)
  - name: PackagePublishingAzureSubscription
    value: REPLACE_WITH_PACKAGE_PUBLISHING_AZURE_SUBSCRIPTION
  - name: PackagePublishingKeyVaultName
    value: REPLACE_WITH_PACKAGE_PUBLISHING_KEY_VAULT_NAME
  - name: NuGetApiKeySecretName
    value: REPLACE_WITH_NUGET_API_KEY_SECRET_NAME
  - name: MyGetApiKeySecretName
    value: REPLACE_WITH_MYGET_API_KEY_SECRET_NAME
parameters:
  - name: isFinalBuild
    type: boolean
    default: false
  - name: releaseEmulator
    type: boolean
    default: false
  - name: releaseSDKCore
    type: boolean
    default: false
  - name: releaseServerlessProtocol
    type: boolean
    default: false
  - name: publishPackages
    type: boolean
    default: false
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/dev
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - src
  batch: true
pr: none
extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      WindowsHostVersion:
        Version: 2022
    globalSdl:
      tsa:
        enabled: false
    settings:
      networkIsolationPolicy: Permissive,CFSClean,NuGet
    stages:
      - stage: Build_And_Sign
        displayName: Build and sign packages
        jobs:
          - job: Build_And_Sign
            displayName: Build, sign, and pack
            cancelTimeoutInMinutes: 1
            pool:
              type: windows
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
              ob_artifactBaseName: drop_packages
            steps:
              - script: git config --global core.longpaths true
                displayName: Enable git long paths
              - checkout: self
                path: s/self
                clean: true
                submodules: true
                fetchDepth: 1
                fetchTags: false
                persistCredentials: true
              - ${{ if eq(parameters.isFinalBuild, true) }}:
                - script: |
                    echo ##vso[task.setvariable variable=VersionSuffix;]rtm
                  displayName: Set VersionSuffix to rtm if it is final build
                - script: |
                    echo $(VersionSuffix)
                    echo $(MSBuildProperties)
                  displayName: Print VersionSuffix and MSBuildProperties
              - task: UseDotNet@2
                displayName: Add 8.x
                inputs:
                  version: 8.x
                  performMultiLevelLookup: true
              - task: UseDotNet@2
                displayName: Add 11.x
                inputs:
                  version: 11.x
                  includePreviewVersions: true
                  performMultiLevelLookup: true
              - task: NuGetAuthenticate@1
                displayName: Authenticate to Azure Artifacts (VSOnline-Internal)
              - task: DotNetCoreCLI@2
                displayName: dotnet build AzureSignalR.sln
                inputs:
                  projects: '$(Pipeline.Workspace)/s/self/AzureSignalR.sln'
                  arguments: /p:$(MSBuildProperties)
              - task: DotNetCoreCLI@2
                displayName: dotnet test
                inputs:
                  command: test
                  projects: '$(Pipeline.Workspace)/s/self/AzureSignalR.sln'
                  arguments: /p:$(MSBuildProperties)
              - task: EsrpCodeSigning@6
                displayName: Authenticode sign first-party DLLs
                inputs:
                  ConnectedServiceName: $(EsrpServiceConnection)
                  UseMSIAuthentication: true
                  AppRegistrationClientId: $(EsrpAppRegistrationClientId)
                  AppRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                  AuthAKVName: $(EsrpKeyVaultName)
                  AuthSignCertName: $(EsrpAuthCertificateName)
                  FolderPath: '$(Pipeline.Workspace)/s/self/src'
                  Pattern: '**/bin/$(BuildConfiguration)/**/Microsoft.Azure.SignalR*.dll'
                  UseMinimatch: true
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "keyCode": "CP-230012",
                        "operationSetCode": "SigntoolSign",
                        "parameters": [
                          { "parameterName": "OpusName", "parameterValue": "Microsoft" },
                          { "parameterName": "OpusInfo", "parameterValue": "https://www.microsoft.com" },
                          { "parameterName": "FileDigest", "parameterValue": "/fd SHA256" },
                          { "parameterName": "PageHash", "parameterValue": "/NPH" },
                          { "parameterName": "TimeStamp", "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256" }
                        ],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      },
                      {
                        "keyCode": "CP-230012",
                        "operationSetCode": "SigntoolVerify",
                        "parameters": [],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      }
                    ]
              - ${{ if or( eq(parameters.isFinalBuild, false),  eq(parameters.releaseSDKCore, true)) }}:
                - task: DotNetCoreCLI@2
                  displayName: dotnet pack SDK Core
                  inputs:
                    command: pack
                    nobuild: true
                    searchPatternPack: '$(Pipeline.Workspace)/s/self/src/Microsoft*/*.csproj;!$(Pipeline.Workspace)/s/self/src/Microsoft.Azure.SignalR.Emulator/Microsoft.Azure.SignalR.Emulator.csproj;!$(Pipeline.Workspace)/s/self/src/Microsoft.Azure.SignalR.Serverless.Protocols/Microsoft.Azure.SignalR.Serverless.Protocols.csproj'
                    outputDir: $(Build.ArtifactStagingDirectory)
                    includesymbols: true
                    includesource: true
                    buildProperties: $(MSBuildProperties)
                    verbosityPack: Normal
                - task: CmdLine@2
                  displayName: Clean Local Feed
                  inputs:
                    script: if exist $(LocalFeed)\ del /s /q $(LocalFeed)
                - task: NuGetCommand@2
                  displayName: Initialize Local Feed
                  inputs:
                    command: custom
                    arguments: init $(Build.ArtifactStagingDirectory) $(LocalFeed)
              - ${{ if or( eq(parameters.isFinalBuild, false),  eq(parameters.releaseEmulator, true)) }}:
                - task: DotNetCoreCLI@2
                  displayName: dotnet pack emulator when only dev or release emulator
                  inputs:
                    command: pack
                    nobuild: true
                    searchPatternPack: '$(Pipeline.Workspace)/s/self/src/Microsoft.Azure.SignalR.Emulator/Microsoft.Azure.SignalR.Emulator.csproj'
                    outputDir: $(Build.ArtifactStagingDirectory)
                    includesymbols: true
                    includesource: true
                    buildProperties: $(MSBuildProperties)
                    verbosityPack: Normal
                - template: /.azure/pipelines/templates/sign-emulator-packages.yml@self
                  parameters:
                    packageDirectory: $(Build.ArtifactStagingDirectory)
                    expandedRoot: $(Pipeline.Workspace)/expanded-emulator-packages
                    serviceConnection: $(EsrpServiceConnection)
                    appRegistrationClientId: $(EsrpAppRegistrationClientId)
                    appRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                    keyVaultName: $(EsrpKeyVaultName)
                    signingCertificateName: $(EsrpAuthCertificateName)
              - ${{ if or( eq(parameters.isFinalBuild, false),  eq(parameters.releaseServerlessProtocol, true)) }}:
                - task: DotNetCoreCLI@2
                  displayName: "dotnet pack serverless protocol when only dev or release "
                  inputs:
                    command: pack
                    nobuild: true
                    searchPatternPack: '$(Pipeline.Workspace)/s/self/src/Microsoft.Azure.SignalR.Serverless.Protocols/Microsoft.Azure.SignalR.Serverless.Protocols.csproj'
                    outputDir: $(Build.ArtifactStagingDirectory)
                    includesymbols: true
                    includesource: true
                    buildProperties: $(MSBuildProperties)
                    verbosityPack: Normal
              - task: EsrpCodeSigning@6
                displayName: Sign NuGet packages with ESRP
                inputs:
                  ConnectedServiceName: $(EsrpServiceConnection)
                  UseMSIAuthentication: true
                  AppRegistrationClientId: $(EsrpAppRegistrationClientId)
                  AppRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                  AuthAKVName: $(EsrpKeyVaultName)
                  AuthSignCertName: $(EsrpNuGetSigningCertificateName)
                  FolderPath: $(Build.ArtifactStagingDirectory)
                  Pattern: '*.nupkg'
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "keyCode": "CP-401405",
                        "operationSetCode": "NuGetSign",
                        "parameters": [],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      },
                      {
                        "keyCode": "CP-401405",
                        "operationSetCode": "NuGetVerify",
                        "parameters": [],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      }
                    ]
              - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
                displayName: "Manifest Generator "
                inputs:
                  BuildDropPath: $(Build.ArtifactStagingDirectory)
      - stage: Release
        displayName: Release signed packages
        dependsOn: Build_And_Sign
        condition: and(succeeded(), ${{ eq(parameters.isFinalBuild, true) }}, ${{ eq(parameters.publishPackages, true) }})
        jobs:
          - job: Release
            displayName: Publish signed packages
            condition: and(succeeded(), ${{ eq(parameters.isFinalBuild, true) }}, ${{ eq(parameters.publishPackages, true) }})
            pool:
              type: windows
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: drop_packages
                  targetPath: '$(Pipeline.Workspace)/Artifact'
            steps:
              - ${{ if and(eq(parameters.isFinalBuild, true), eq(parameters.publishPackages, true)) }}:
                - task: AzureKeyVault@2
                  displayName: Retrieve package publishing API keys
                  inputs:
                    azureSubscription: $(PackagePublishingAzureSubscription)
                    KeyVaultName: $(PackagePublishingKeyVaultName)
                    SecretsFilter: $(NuGetApiKeySecretName),$(MyGetApiKeySecretName)
                    RunAsPreJob: false
                - pwsh: |
                    Get-ChildItem "$(Pipeline.Workspace)\Artifact" -Recurse -Filter *.nupkg | ForEach-Object {
                      dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
                    }
                  displayName: Publish packages to NuGet.org
                  env:
                    NUGET_API_KEY: $($(NuGetApiKeySecretName))
                - pwsh: |
                    Get-ChildItem "$(Pipeline.Workspace)\Artifact" -Recurse -Filter *.nupkg | ForEach-Object {
                      dotnet nuget push $_.FullName --source https://www.myget.org/F/azure-signalr-dev/api/v3/index.json --api-key $env:MYGET_API_KEY --skip-duplicate
                    }
                  displayName: Publish packages to MyGet
                  env:
                    MYGET_API_KEY: $($(MyGetApiKeySecretName))
              - ${{ if eq(parameters.isFinalBuild, true) }}:
                - task: AzurePowerShell@5
                  displayName: 'Install AzCopy (Windows)'
                  inputs:
                    azureSubscription: azuresdkpartnerdrops
                    ScriptType: InlineScript
                    azurePowerShellVersion: LatestVersion
                    pwsh: true
                    Inline: |
                      $ErrorActionPreference = 'Stop'
                      $zip = Join-Path $env:TEMP 'azcopy.zip'
                      $dir = Join-Path $env:TEMP 'azcopy'
                      $exe = Join-Path $dir 'azcopy.exe'
                      Invoke-WebRequest -Uri "https://aka.ms/downloadazcopy-v10-windows" -OutFile $zip
                      if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
                      Expand-Archive -Path $zip -DestinationPath $dir

                      # The zip contains a subfolder like azcopy_windows_amd64_*/azcopy.exe
                      $found = Get-ChildItem $dir -Recurse -Filter azcopy.exe | Select-Object -First 1
                      if (-not $found) { throw "azcopy.exe not found after extraction" }

                      $az = $found.FullName
                      Write-Host "AzCopy path: $az"
                      & $az --version

                      # Put it on PATH for subsequent steps in the same job
                      Write-Host "##vso[task.prependpath]$($found.DirectoryName)"
                - task: AzurePowerShell@5
                  displayName: 'Upload files to partner drop folder'
                  inputs:
                    azureSubscription: 'azuresdkpartnerdrops'
                    ScriptType: 'InlineScript'
                    azurePowerShellVersion: LatestVersion
                    pwsh: true
                    Inline: |
                      azcopy copy  "$(Pipeline.Workspace)/Artifact/*" "https://azuresdkpartnerdrops.blob.core.windows.net/drops/azure-signalr/dotnet/$(BuildNumber)/" --recursive --log-level=INFO
                  env:
                    AZCOPY_AUTO_LOGIN_TYPE: 'PSCRED'


