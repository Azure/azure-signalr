name: $(Date:yyyyMMdd).$(Rev:r)
variables:
  - group: npm-release
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  - name: WindowsContainerImage
    value: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest
  - name: LinuxContainerImage
    value: mcr.microsoft.com/onebranch/azurelinux/build:3.0
  - name: EmulatorContainerRegistryServiceConnection
    value: azure-webpubsub-emulator-acr
  - name: EmulatorContainerRegistry
    value: signalrservice
  - name: EmulatorContainerRepository
    value: signalr/signalr-emulator
  - name: BuildConfiguration
    value: Release
  - name: BuildNumber
    value: $(Build.BuildId)
  - name: Codeql.Enabled
    value: true
  - name: IsTargetMultiFramework
    value: true
  - name: LocalFeed
    value: $(UserProfile)\localfeed
  - name: GIT_CONFIG_COUNT
    value: 1
  - name: GIT_CONFIG_KEY_0
    value: core.longpaths
  - name: GIT_CONFIG_VALUE_0
    value: true
  - name: MSBuildProperties
    value: Configuration=$(BuildConfiguration);BuildNumber=$(BuildNumber);VersionSuffix=rtm;IsTargetMultiFramework=$(IsTargetMultiFramework);SignType=$(SignType);IsFinalBuild=true
  - name: SignType
    value: real
  - name: TeamName
    value: Azure SignalR Team
  - name: EsrpServiceConnection
    value: $(ESRP_SERVICE_CONNECTION)
  - name: EsrpAppRegistrationClientId
    value: $(ESRP_CLIENT_ID)
  - name: EsrpAppRegistrationTenantId
    value: $(ESRP_TENANT_ID)
  - name: EsrpKeyVaultName
    value: $(ESRP_KEY_VAULT_NAME)
  - name: EsrpAuthCertificateName
    value: $(ESRP_SIGN_CERT_NAME)
  - name: EsrpNuGetSigningCertificateName
    value: $(ESRP_SIGN_CERT_NAME)
  - name: EsrpNuGetOrganization
    value: sravanism
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/dev
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
trigger:
  branches:
    include:
      - dev
  batch: true
pr: none
extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      use1esentry: true
      WindowsHostVersion:
        Version: 2022
    release:
      category: NonAzure
    globalSdl:
      tsa:
        enabled: false
    stages:
      - stage: Build_And_Sign
        displayName: Build, test and sign SDK packages
        dependsOn: []
        isSkippable: false
        jobs:
          - job: Build_And_Sign
            displayName: Build, sign, and pack
            cancelTimeoutInMinutes: 1
            pool:
              type: windows
            variables:
              ob_outputDirectory: $(Build.ArtifactStagingDirectory)
              ob_artifactBaseName: drop_packages
            steps:
              - script: git config --global core.longpaths true
                displayName: Enable git long paths
              - checkout: self
                path: s/self
                clean: true
                submodules: true
                fetchDepth: 1
                fetchTags: false
                persistCredentials: true
                env:
                  ob_restore_phase: true
              - task: UseDotNet@2
                displayName: Add 8.x
                inputs:
                  version: 8.x
                  performMultiLevelLookup: true
              - task: UseDotNet@2
                displayName: Add 11.x
                inputs:
                  version: 11.x
                  includePreviewVersions: true
                  performMultiLevelLookup: true
              - task: NuGetAuthenticate@1
                displayName: Authenticate to Azure Artifacts (VSOnline-Internal)
              - task: DotNetCoreCLI@2
                displayName: dotnet build AzureSignalR.sln
                inputs:
                  projects: '$(Pipeline.Workspace)/s/self/AzureSignalR.sln'
                  arguments: /p:$(MSBuildProperties)
              - task: DotNetCoreCLI@2
                displayName: dotnet test
                inputs:
                  command: test
                  projects: '$(Pipeline.Workspace)/s/self/AzureSignalR.sln'
                  arguments: /p:$(MSBuildProperties)
              - task: EsrpCodeSigning@6
                displayName: Authenticode sign first-party DLLs
                inputs:
                  ConnectedServiceName: $(EsrpServiceConnection)
                  UseMSIAuthentication: true
                  AppRegistrationClientId: $(EsrpAppRegistrationClientId)
                  AppRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                  AuthAKVName: $(EsrpKeyVaultName)
                  AuthSignCertName: $(EsrpAuthCertificateName)
                  FolderPath: '$(Pipeline.Workspace)/s/self/src'
                  Pattern: '**/bin/$(BuildConfiguration)/**/Microsoft.Azure.SignalR*.dll'
                  UseMinimatch: true
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "keyCode": "CP-230012",
                        "operationSetCode": "SigntoolSign",
                        "parameters": [
                          { "parameterName": "OpusName", "parameterValue": "Microsoft" },
                          { "parameterName": "OpusInfo", "parameterValue": "https://www.microsoft.com" },
                          { "parameterName": "FileDigest", "parameterValue": "/fd SHA256" },
                          { "parameterName": "PageHash", "parameterValue": "/NPH" },
                          { "parameterName": "TimeStamp", "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256" }
                        ],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      },
                      {
                        "keyCode": "CP-230012",
                        "operationSetCode": "SigntoolVerify",
                        "parameters": [],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      }
                    ]
              - task: PowerShell@2
                displayName: Pack SDK release and preview packages
                inputs:
                  pwsh: true
                  filePath: $(Pipeline.Workspace)/s/self/.azure/pipelines/scripts/Pack-SdkPackages.ps1
                  workingDirectory: $(Pipeline.Workspace)/s/self
                  arguments: >-
                    -OutputDirectory "$(Build.ArtifactStagingDirectory)"
                    -BuildNumber "$(BuildNumber)" -Configuration "$(BuildConfiguration)" -SignType "$(SignType)"
              - task: EsrpCodeSigning@6
                displayName: Sign NuGet packages with ESRP
                inputs:
                  ConnectedServiceName: $(EsrpServiceConnection)
                  UseMSIAuthentication: true
                  AppRegistrationClientId: $(EsrpAppRegistrationClientId)
                  AppRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                  AuthAKVName: $(EsrpKeyVaultName)
                  AuthSignCertName: $(EsrpNuGetSigningCertificateName)
                  FolderPath: $(Build.ArtifactStagingDirectory)
                  Pattern: '**/*.nupkg'
                  UseMinimatch: true
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "keyCode": "CP-401405",
                        "operationSetCode": "NuGetSign",
                        "parameters": [],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      },
                      {
                        "keyCode": "CP-401405",
                        "operationSetCode": "NuGetVerify",
                        "parameters": [],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      }
                    ]
              - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
                displayName: "Manifest Generator "
                inputs:
                  BuildDropPath: $(Build.ArtifactStagingDirectory)
      - template: templates/sdk-release.yml

      - template: templates/emulator.yml
