stages:
  - stage: Emulator_Build
    displayName: Build and test emulator packages
    dependsOn: []
    isSkippable: false
    jobs:
      - job: Build
        templateContext:
          outputs:
            - output: pipelineArtifact
              artifactName: Emulator
              targetPath: $(Build.ArtifactStagingDirectory)/emulator
        steps:
          - checkout: self
            path: s/self
            clean: true
            fetchDepth: 1
            persistCredentials: false
          - task: UseDotNet@2
            inputs:
              version: 8.x
          - task: UseDotNet@2
            inputs:
              version: 10.x
          - task: NuGetAuthenticate@1
          - task: PowerShell@2
            displayName: Test release integrity checks
            inputs:
              pwsh: true
              filePath: .azure/pipelines/scripts/Test-EmulatorRelease.ps1
          - task: PowerShell@2
            displayName: Build, test and pack emulator
            inputs:
              pwsh: true
              filePath: .azure/pipelines/scripts/Build-EmulatorPackage.ps1
              arguments: >-
                -OutputDirectory "$(Build.ArtifactStagingDirectory)/emulator"
                -BuildId "$(Build.BuildId)" -SignType "$(SignType)" -Phase Build
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/TestResults/*.trx'
          - ${{ each kind in split('release,preview', ',') }}:
              - template: sign-emulator-packages.yml
                parameters:
                  packageDirectory: $(Build.ArtifactStagingDirectory)/emulator/${{ kind }}
                  expandedRoot: $(Agent.TempDirectory)/signed-emulator-${{ kind }}
                  serviceConnection: $(EsrpServiceConnection)
                  appRegistrationClientId: $(EsrpAppRegistrationClientId)
                  appRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                  keyVaultName: $(EsrpKeyVaultName)
                  signingCertificateName: $(EsrpAuthCertificateName)
          - task: EsrpCodeSigning@6
            displayName: Sign emulator NuGet packages
            inputs:
              ConnectedServiceName: $(EsrpServiceConnection)
              UseMSIAuthentication: true
              AppRegistrationClientId: $(EsrpAppRegistrationClientId)
              AppRegistrationTenantId: $(EsrpAppRegistrationTenantId)
              AuthAKVName: $(EsrpKeyVaultName)
              AuthSignCertName: $(EsrpNuGetSigningCertificateName)
              FolderPath: $(Build.ArtifactStagingDirectory)/emulator
              Pattern: '**/*.nupkg'
              UseMinimatch: true
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                  { "keyCode": "CP-401405", "operationSetCode": "NuGetSign", "parameters": [], "toolName": "sign", "toolVersion": "1.0" },
                  { "keyCode": "CP-401405", "operationSetCode": "NuGetVerify", "parameters": [], "toolName": "sign", "toolVersion": "1.0" }
                ]
          - task: PowerShell@2
            displayName: Install and validate signed packages
            inputs:
              pwsh: true
              filePath: .azure/pipelines/scripts/Build-EmulatorPackage.ps1
              arguments: >-
                -OutputDirectory "$(Build.ArtifactStagingDirectory)/emulator"
                -BuildId "$(Build.BuildId)" -SignType "$(SignType)" -Phase Validate

  - stage: Emulator_Preview
    displayName: Publish emulator preview
    dependsOn: Emulator_Build
    isSkippable: false
    condition: and(succeeded(), eq(dependencies.Emulator_Build.result, 'Succeeded'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - job: Publish
        condition: and(not(canceled()), eq(variables['buildResult'], 'Succeeded'))
        variables:
          buildResult: $[ stageDependencies.Emulator_Build.Build.result ]
        templateContext:
          type: releaseJob
          isProduction: false
          inputs:
            - input: pipelineArtifact
              artifactName: Emulator
              targetPath: $(Pipeline.Workspace)/emulator
        steps:
          - task: 1ES.PublishNuGet@1
            displayName: Publish emulator preview to MyGet
            inputs:
              useDotNetTask: false
              packageParentPath: $(Pipeline.Workspace)/emulator/preview
              packagesToPush: '$(Pipeline.Workspace)/emulator/preview/*.nupkg;!$(Pipeline.Workspace)/emulator/preview/*.symbols.nupkg'
              nuGetFeedType: external
              publishFeedCredentials: azure-signalr-dev

  - template: nuget-release.yml
    parameters:
      package: Emulator
      title: Emulator
      buildStage: Emulator_Build
      buildJob: Build
      artifactName: Emulator
      packageDirectory: release
      validationSteps:
        - task: PowerShell@2
          displayName: Verify tested emulator package provenance and hashes
          inputs:
            pwsh: true
            filePath: $(Pipeline.Workspace)/nuget-Emulator/Prepare-EmulatorRelease.ps1
            arguments: '-ArtifactDirectory "$(Pipeline.Workspace)/nuget-Emulator" -Action package'

  - stage: Emulator_Container
    displayName: Build and test emulator image
    dependsOn: Emulator_Build
    isSkippable: false
    condition: and(succeeded(), eq(dependencies.Emulator_Build.result, 'Succeeded'))
    jobs:
      - job: Build
        condition: and(not(canceled()), eq(variables['buildResult'], 'Succeeded'))
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: ubuntu-latest
          os: linux
        variables:
          buildResult: $[ stageDependencies.Emulator_Build.Build.result ]
        templateContext:
          outputs:
            - output: pipelineArtifact
              artifactName: EmulatorContainer
              targetPath: $(Build.ArtifactStagingDirectory)/emulator-container
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1
            persistCredentials: false
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: current
              artifactName: Emulator
              itemPattern: |
                Dockerfile
                package-release.json
                release/*.nupkg
              targetPath: $(Pipeline.Workspace)/emulator
          - task: PowerShell@2
            displayName: Build image from the tested package and run smoke test
            inputs:
              pwsh: true
              filePath: .azure/pipelines/scripts/Build-EmulatorContainer.ps1
              arguments: >-
                -PackageDirectory "$(Pipeline.Workspace)/emulator"
                -OutputDirectory "$(Build.ArtifactStagingDirectory)/emulator-container"

  - template: emulator-container-release.yml
    parameters:
      action: version
      prerequisiteStage: Emulator_Container
      prerequisiteJob: Build

  - template: emulator-container-release.yml
    parameters:
      action: latest
      prerequisiteStage: Emulator_Container_version_Publish
      prerequisiteJob: Publish
