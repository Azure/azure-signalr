stages:
  - stage: Emulator_Build
    displayName: Build and test emulator packages
    dependsOn: []
    isSkippable: false
    jobs:
      - job: Build
        pool:
          type: windows
        variables:
          ob_outputDirectory: $(Build.ArtifactStagingDirectory)/emulator
          ob_artifactBaseName: Emulator
        steps:
          - checkout: self
            path: s/self
            clean: true
            fetchDepth: 1
            persistCredentials: false
            env:
              ob_restore_phase: true
          - task: UseDotNet@2
            inputs:
              version: 8.x
          - task: UseDotNet@2
            inputs:
              version: 10.x
          - task: NuGetAuthenticate@1
          - task: PowerShell@2
            displayName: Test release integrity checks
            inputs:
              pwsh: true
              filePath: $(Pipeline.Workspace)/s/self/.azure/pipelines/scripts/Test-EmulatorRelease.ps1
          - task: PowerShell@2
            displayName: Build, test and pack emulator
            inputs:
              pwsh: true
              filePath: $(Pipeline.Workspace)/s/self/.azure/pipelines/scripts/Build-EmulatorPackage.ps1
              workingDirectory: $(Pipeline.Workspace)/s/self
              arguments: >-
                -OutputDirectory "$(Build.ArtifactStagingDirectory)/emulator"
                -BuildId "$(Build.BuildId)" -SignType "$(SignType)" -Phase Build
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/TestResults/*.trx'
          - ${{ each kind in split('release,preview', ',') }}:
              - template: sign-emulator-packages.yml
                parameters:
                  packageDirectory: $(Build.ArtifactStagingDirectory)/emulator/${{ kind }}
                  expandedRoot: $(Agent.TempDirectory)/signed-emulator-${{ kind }}
                  serviceConnection: $(EsrpServiceConnection)
                  appRegistrationClientId: $(EsrpAppRegistrationClientId)
                  appRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                  keyVaultName: $(EsrpKeyVaultName)
                  signingCertificateName: $(EsrpAuthCertificateName)
          - task: EsrpCodeSigning@6
            displayName: Sign emulator NuGet packages
            inputs:
              ConnectedServiceName: $(EsrpServiceConnection)
              UseMSIAuthentication: true
              AppRegistrationClientId: $(EsrpAppRegistrationClientId)
              AppRegistrationTenantId: $(EsrpAppRegistrationTenantId)
              AuthAKVName: $(EsrpKeyVaultName)
              AuthSignCertName: $(EsrpNuGetSigningCertificateName)
              FolderPath: $(Build.ArtifactStagingDirectory)/emulator
              Pattern: '**/*.nupkg'
              UseMinimatch: true
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                  { "keyCode": "CP-401405", "operationSetCode": "NuGetSign", "parameters": [], "toolName": "sign", "toolVersion": "1.0" },
                  { "keyCode": "CP-401405", "operationSetCode": "NuGetVerify", "parameters": [], "toolName": "sign", "toolVersion": "1.0" }
                ]
          - task: PowerShell@2
            displayName: Install and validate signed packages
            inputs:
              pwsh: true
              filePath: $(Pipeline.Workspace)/s/self/.azure/pipelines/scripts/Build-EmulatorPackage.ps1
              workingDirectory: $(Pipeline.Workspace)/s/self
              arguments: >-
                -OutputDirectory "$(Build.ArtifactStagingDirectory)/emulator"
                -BuildId "$(Build.BuildId)" -SignType "$(SignType)" -Phase Validate
          - pwsh: |
              $metadata = Get-Content '$(ob_outputDirectory)/package-release.json' -Raw | ConvertFrom-Json
              Write-Host "##vso[task.setvariable variable=version;isOutput=true]$($metadata.version)"
              Write-Host "##vso[task.setvariable variable=packageSha256;isOutput=true]$($metadata.packageSha256)"
              Copy-Item '$(Pipeline.Workspace)/s/self/.azure/pipelines/templates/emulator-container-tests.json' '$(ob_outputDirectory)'
            name: container
            displayName: Prepare container build inputs

  - stage: Emulator_Preview
    displayName: Publish emulator preview
    dependsOn: Emulator_Build
    isSkippable: false
    condition: and(succeeded(), eq(dependencies.Emulator_Build.result, 'Succeeded'), or(eq(variables['Build.SourceBranch'], 'refs/heads/dev'), eq(variables['Build.Reason'], 'Manual')))
    variables:
      ob_release_environment: Test
    jobs:
      - job: Publish
        condition: and(not(canceled()), eq(variables['buildResult'], 'Succeeded'))
        pool:
          type: release
          os: windows
        variables:
          buildResult: $[ stageDependencies.Emulator_Build.Build.result ]
          ob_outputDirectory: $(Build.ArtifactStagingDirectory)
          ob_sdl_codeSignValidation_enabled: false
          ob_sdl_binskim_enabled: false
        templateContext:
          inputs:
            - input: pipelineArtifact
              artifactName: Emulator
              targetPath: $(Pipeline.Workspace)/emulator
        steps:
          - task: UseDotNet@2
            inputs:
              version: 8.x
          - task: 1ES.PublishNuGet@1
            displayName: Publish emulator preview to MyGet
            inputs:
              useDotNetTask: false
              packageParentPath: $(Pipeline.Workspace)/emulator/preview
              packagesToPush: '$(Pipeline.Workspace)/emulator/preview/*.nupkg;!$(Pipeline.Workspace)/emulator/preview/*.symbols.nupkg'
              nuGetFeedType: external
              publishFeedCredentials: azure-signalr-dev

  - template: nuget-release.yml
    parameters:
      package: Emulator
      title: Emulator
      buildStage: Emulator_Build
      buildJob: Build
      artifactName: Emulator
      packageDirectory: release
      validationSteps:
        - task: PowerShell@2
          displayName: Verify tested emulator package provenance and hashes
          inputs:
            pwsh: true
            filePath: $(Pipeline.Workspace)/nuget-Emulator/Prepare-EmulatorRelease.ps1
            arguments: '-ArtifactDirectory "$(Pipeline.Workspace)/nuget-Emulator" -Action package'

  - stage: Emulator_Container_Build
    displayName: Build and test emulator image with OneBranch
    dependsOn: Emulator_Build
    isSkippable: false
    condition: and(succeeded(), eq(dependencies.Emulator_Build.result, 'Succeeded'))
    jobs:
      - job: Build
        condition: and(not(canceled()), eq(variables['buildResult'], 'Succeeded'))
        pool:
          type: docker
          os: linux
        variables:
          buildResult: $[ stageDependencies.Emulator_Build.Build.result ]
          emulatorReleaseVersion: $[ stageDependencies.Emulator_Build.Build.outputs['container.version'] ]
          emulatorPackageSha256: $[ stageDependencies.Emulator_Build.Build.outputs['container.packageSha256'] ]
          ob_git_checkout: false
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: current
              artifactName: Emulator
              itemPattern: |
                Dockerfile
                package-release.json
                release/*.nupkg
                emulator-container-tests.json
              targetPath: $(Build.SourcesDirectory)/dst
          - task: onebranch.pipeline.imagebuildinfo@1
            displayName: Build release-package image and test health endpoint
            inputs:
              repositoryName: signalr-emulator-build
              registry: onebranch.azurecr.io
              dockerFileRelPath: Dockerfile
              dockerFileContextPath: .
              build_tag: $(Build.BuildId)
              arguments: >-
                --build-arg EMULATOR_VERSION=$(emulatorReleaseVersion) --build-arg EMULATOR_FEED=/context/release
                --label org.opencontainers.image.revision=$(Build.SourceVersion)
                --label com.azure.signalr.package.sha256=$(emulatorPackageSha256)
              buildkit: 1
              enable_network: true
              enable_acr_push: false
              enable_isolated_acr_push: false
              saveImageToPath: signalr-emulator.$(emulatorReleaseVersion).linux-amd64.tar
              compress: false
              containerTestsYAMLPath: $(Build.SourcesDirectory)/dst/emulator-container-tests.json
              failTaskOnFailedTests: true

  - stage: Emulator_Container
    displayName: Record tested emulator image artifact
    dependsOn:
      - Emulator_Build
      - Emulator_Container_Build
    isSkippable: false
    condition: and(succeeded(), eq(dependencies.Emulator_Build.result, 'Succeeded'), eq(dependencies.Emulator_Container_Build.result, 'Succeeded'))
    jobs:
      - job: Build
        condition: and(not(canceled()), eq(variables['containerBuildResult'], 'Succeeded'))
        pool:
          type: linux
        variables:
          containerBuildResult: $[ stageDependencies.Emulator_Container_Build.Build.result ]
          ob_outputDirectory: $(Build.ArtifactStagingDirectory)/emulator-container
          ob_artifactBaseName: EmulatorContainer
        steps:
          - checkout: self
            path: s/self
            clean: true
            fetchDepth: 1
            persistCredentials: false
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: current
              artifactName: Emulator
              itemPattern: package-release.json
              targetPath: $(Pipeline.Workspace)/emulator
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: current
              artifactName: drop_Emulator_Container_Build_Build
              itemPattern: signalr-emulator.*.linux-amd64.tar
              targetPath: $(ob_outputDirectory)
          - task: PowerShell@2
            displayName: Verify tested image provenance and save release artifact
            inputs:
              pwsh: true
              filePath: $(Pipeline.Workspace)/s/self/.azure/pipelines/scripts/Complete-EmulatorContainer.ps1
              arguments: >-
                -PackageDirectory "$(Pipeline.Workspace)/emulator" -OutputDirectory "$(ob_outputDirectory)"

  - template: emulator-container-release.yml
    parameters:
      action: version
      prerequisiteStage: Emulator_Container
      prerequisiteJob: Build

  - template: emulator-container-release.yml
    parameters:
      action: latest
      prerequisiteStage: Emulator_Container_version_Publish
      prerequisiteJob: Publish
