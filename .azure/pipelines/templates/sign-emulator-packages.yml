parameters:
  - name: packageDirectory
    type: string
  - name: expandedRoot
    type: string

steps:
  - task: PowerShell@2
    displayName: Expand Emulator packages for signing
    inputs:
      filePath: '$(Pipeline.Workspace)/s/self/.azure/pipelines/scripts/Update-EmulatorPackages.ps1'
      arguments: >-
        -Action Expand
        -PackageDirectory '${{ parameters.packageDirectory }}'
        -ExpandedRoot '${{ parameters.expandedRoot }}'
      pwsh: true

  - task: EsrpCodeSigning@6
    displayName: Authenticode sign Emulator DLLs
    inputs:
      ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
      UseMSIAuthentication: true
      AppRegistrationClientId: $(ESRP_CLIENT_ID)
      AppRegistrationTenantId: $(ESRP_TENANT_ID)
      AuthAKVName: $(ESRP_KEY_VAULT_NAME)
      AuthSignCertName: $(ESRP_SIGN_CERT_NAME)
      FolderPath: ${{ parameters.expandedRoot }}
      Pattern: '**/Microsoft.Azure.SignalR.Emulator.dll'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: |
        [
          {
            "keyCode": "CP-230012",
            "operationSetCode": "SigntoolSign",
            "parameters": [
              { "parameterName": "OpusName", "parameterValue": "Microsoft" },
              { "parameterName": "OpusInfo", "parameterValue": "https://www.microsoft.com" },
              { "parameterName": "FileDigest", "parameterValue": "/fd SHA256" },
              { "parameterName": "PageHash", "parameterValue": "/NPH" },
              { "parameterName": "TimeStamp", "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256" }
            ],
            "toolName": "sign",
            "toolVersion": "1.0"
          },
          {
            "keyCode": "CP-230012",
            "operationSetCode": "SigntoolVerify",
            "parameters": [],
            "toolName": "sign",
            "toolVersion": "1.0"
          }
        ]

  - task: EsrpCodeSigning@6
    displayName: Authenticode sign MessagePack DLLs
    inputs:
      ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
      UseMSIAuthentication: true
      AppRegistrationClientId: $(ESRP_CLIENT_ID)
      AppRegistrationTenantId: $(ESRP_TENANT_ID)
      AuthAKVName: $(ESRP_KEY_VAULT_NAME)
      AuthSignCertName: $(ESRP_SIGN_CERT_NAME)
      FolderPath: ${{ parameters.expandedRoot }}
      Pattern: '**/MessagePack*.dll'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: |
        [
          {
            "keyCode": "CP-231522",
            "operationSetCode": "SigntoolSign",
            "parameters": [
              { "parameterName": "OpusName", "parameterValue": "Microsoft" },
              { "parameterName": "OpusInfo", "parameterValue": "https://www.microsoft.com" },
              { "parameterName": "Append", "parameterValue": "/as" },
              { "parameterName": "FileDigest", "parameterValue": "/fd SHA256" },
              { "parameterName": "PageHash", "parameterValue": "/NPH" },
              { "parameterName": "TimeStamp", "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256" }
            ],
            "toolName": "sign",
            "toolVersion": "1.0"
          },
          {
            "keyCode": "CP-231522",
            "operationSetCode": "SigntoolVerify",
            "parameters": [],
            "toolName": "sign",
            "toolVersion": "1.0"
          }
        ]

  - task: EsrpCodeSigning@6
    displayName: Authenticode sign Newtonsoft.Json DLLs
    inputs:
      ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
      UseMSIAuthentication: true
      AppRegistrationClientId: $(ESRP_CLIENT_ID)
      AppRegistrationTenantId: $(ESRP_TENANT_ID)
      AuthAKVName: $(ESRP_KEY_VAULT_NAME)
      AuthSignCertName: $(ESRP_SIGN_CERT_NAME)
      FolderPath: ${{ parameters.expandedRoot }}
      Pattern: '**/Newtonsoft.Json*.dll'
      UseMinimatch: true
      signConfigType: inlineSignParams
      inlineOperation: |
        [
          {
            "keyCode": "CP-231522",
            "operationSetCode": "SigntoolSign",
            "parameters": [
              { "parameterName": "OpusName", "parameterValue": "Microsoft" },
              { "parameterName": "OpusInfo", "parameterValue": "https://www.microsoft.com" },
              { "parameterName": "Append", "parameterValue": "/as" },
              { "parameterName": "FileDigest", "parameterValue": "/fd SHA256" },
              { "parameterName": "PageHash", "parameterValue": "/NPH" },
              { "parameterName": "TimeStamp", "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256" }
            ],
            "toolName": "sign",
            "toolVersion": "1.0"
          },
          {
            "keyCode": "CP-231522",
            "operationSetCode": "SigntoolVerify",
            "parameters": [],
            "toolName": "sign",
            "toolVersion": "1.0"
          }
        ]

  - task: PowerShell@2
    displayName: Repack signed Emulator packages
    inputs:
      filePath: '$(Pipeline.Workspace)/s/self/.azure/pipelines/scripts/Update-EmulatorPackages.ps1'
      arguments: >-
        -Action Repack
        -PackageDirectory '${{ parameters.packageDirectory }}'
        -ExpandedRoot '${{ parameters.expandedRoot }}'
      pwsh: true
