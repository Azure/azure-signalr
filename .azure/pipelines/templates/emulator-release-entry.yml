parameters:
  - name: action
    type: string
  - name: title
    type: string

stages:
  # Manual stages cannot depend on the build. The publisher below enforces it.
  - stage: Emulator_${{ parameters.action }}_Release
    displayName: ${{ parameters.title }}
    trigger: manual
    isSkippable: true
    condition: not(canceled())
    variables:
      ob_release_environment: Test
    jobs:
      - job: Start
        pool:
          type: server
        steps:
          # Run stage is the release decision; no second confirmation is needed.
          - task: Delay@1
            inputs:
              delayForMinutes: '0'
