schemaVersion: '2.0.0'
metadataTest:
  workdir: /emulator
  entrypoint: [asrs-emulator, start, -i, '0.0.0.0']
  exposedPorts: ['8888']
commandTests:
  - name: Emulator health endpoint
    command: /usr/bin/timeout
    args:
      - --kill-after=5s
      - 120s
      - /bin/bash
      - -ec
      # container-structure-test expands $variables before execution; use Bash job specs.
      - |
        asrs-emulator start -i 127.0.0.1 >/tmp/emulator-smoke.log 2>&1 &
        trap 'kill %1 2>/dev/null || true; wait %1 2>/dev/null || true' EXIT
        for attempt in {1..30}; do
          kill -0 %1 || { cat /tmp/emulator-smoke.log; exit 1; }
          if timeout 2 bash -c '
            exec 3<>/dev/tcp/127.0.0.1/8888
            printf "HEAD /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
            head -n 1 <&3 | grep -q "^HTTP/1[.][01] 200 "
          ' 2>/dev/null; then
            echo 'PASS emulator container health'
            exit 0
          fi
          sleep 1
        done
        cat /tmp/emulator-smoke.log
        exit 1
    expectedOutput: [PASS emulator container health]
    exitCode: 0
