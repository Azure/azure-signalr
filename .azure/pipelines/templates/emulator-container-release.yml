parameters:
  - name: action
    type: string
    values: [version, latest]
  - name: prerequisiteStage
    type: string
  - name: prerequisiteJob
    type: string

stages:
  - template: emulator-release-entry.yml
    parameters:
      action: Container_${{ parameters.action }}
      title: Release emulator Docker ${{ parameters.action }}

  - stage: Emulator_Container_${{ parameters.action }}_Publish
    displayName: Publish emulator Docker ${{ parameters.action }}
    dependsOn:
      - ${{ parameters.prerequisiteStage }}
      - Emulator_Container_${{ parameters.action }}_Release
    isSkippable: false
    condition: |
      and(
        succeeded(),
        eq(dependencies.${{ parameters.prerequisiteStage }}.result, 'Succeeded'),
        eq(dependencies.Emulator_Container_${{ parameters.action }}_Release.result, 'Succeeded'),
        eq(variables['Build.SourceBranch'], 'refs/heads/dev')
      )
    lockBehavior: sequential
    variables:
      ob_release_environment: Production
    jobs:
      - job: Publish
        condition: and(not(canceled()), eq(variables['prerequisiteResult'], 'Succeeded'))
        pool:
          type: release
          os: linux
        variables:
          prerequisiteResult: $[ stageDependencies.${{ parameters.prerequisiteStage }}.${{ parameters.prerequisiteJob }}.result ]
          ORAS_VERSION: latest
        templateContext:
          inputs:
            - input: pipelineArtifact
              artifactName: EmulatorContainer
              targetPath: $(Pipeline.Workspace)/emulator-container
        steps:
          - task: PowerShell@2
            displayName: Verify tested image provenance and hash
            inputs:
              pwsh: true
              filePath: $(Pipeline.Workspace)/emulator-container/Prepare-EmulatorRelease.ps1
              arguments: '-ArtifactDirectory "$(Pipeline.Workspace)/emulator-container" -Action ${{ parameters.action }}'
            env:
              EMULATOR_CONTAINER_REGISTRY: $(EmulatorContainerRegistry)
              EMULATOR_CONTAINER_REPOSITORY: $(EmulatorContainerRepository)
          - task: ContainerSecuritySetup@2
            inputs:
              skipBuildkitWorker: true
          - task: Docker@1
            displayName: Authenticate to the emulator registry
            inputs:
              containerregistrytype: Azure Container Registry
              azureSubscriptionEndpoint: $(EmulatorContainerRegistryServiceConnection)
              azureContainerRegistry: $(emulatorRegistry)
              command: login
          - task: ContainerSecurityCopyImage@2
            displayName: Load tested image archive
            inputs:
              image: $(emulatorImageReference)
              sourceType: tarball
              sourceTarballPath: $(emulatorArchivePath)
              targetType: ociLayout
              targetOciLayout: $(Agent.TempDirectory)/emulator-image
          - task: ContainerSecurityCopyImage@2
            displayName: Publish Docker ${{ parameters.action }}
            inputs:
              image: $(emulatorImageReference)
              sourceType: ociLayout
              sourceOciLayout: $(Agent.TempDirectory)/emulator-image
              targetType: remoteImage
              targetRemoteImages: $(emulatorTargetImage)
          - task: PowerShell@2
            displayName: Verify published image digest
            inputs:
              pwsh: true
              filePath: $(Pipeline.Workspace)/emulator-container/Verify-EmulatorContainer.ps1
              arguments: >-
                -OciLayout "$(Agent.TempDirectory)/emulator-image"
                -ImageReference "$(emulatorImageReference)"
                -TargetImage "$(emulatorTargetImage)"
                -OrasPath "$(Agent.ToolsDirectory)/oras/$(ORAS_VERSION)/x64/oras"
