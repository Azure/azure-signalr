parameters:
  - name: releaseType
    type: string
    default: preview
    values: [preview, release]

stages:
  - ${{ if eq(parameters.releaseType, 'preview') }}:
    - stage: SDK_Preview
      displayName: Publish SDK previews to MyGet
      dependsOn: Build_And_Sign
      isSkippable: false
      condition: and(succeeded(), eq(dependencies.Build_And_Sign.result, 'Succeeded'), or(eq(variables['Build.SourceBranch'], 'refs/heads/dev'), eq(variables['Build.Reason'], 'Manual')))
      variables:
        ob_release_environment: Test
      jobs:
        - job: Publish
          condition: and(not(canceled()), eq(variables['buildResult'], 'Succeeded'))
          pool:
            type: release
            os: windows
          variables:
            buildResult: $[ stageDependencies.Build_And_Sign.Build_And_Sign.result ]
            ob_outputDirectory: $(Build.ArtifactStagingDirectory)
            ob_sdl_codeSignValidation_enabled: false
            ob_sdl_binskim_enabled: false
          templateContext:
            inputs:
              - input: pipelineArtifact
                artifactName: drop_packages
                targetPath: $(Pipeline.Workspace)/sdk-packages
          steps:
            - task: UseDotNet@2
              inputs:
                version: 8.x
            - task: 1ES.PublishNuGet@1
              displayName: Publish SDK and Serverless Protocol previews to MyGet
              inputs:
                useDotNetTask: false
                packageParentPath: $(Pipeline.Workspace)/sdk-packages/preview
                packagesToPush: '$(Pipeline.Workspace)/sdk-packages/preview/**/*.nupkg;!$(Pipeline.Workspace)/sdk-packages/preview/**/*.symbols.nupkg'
                nuGetFeedType: external
                publishFeedCredentials: azure-signalr-dev

  - template: nuget-release.yml
    parameters:
      package: SDK
      title: SDK (${{ parameters.releaseType }})
      releaseType: ${{ parameters.releaseType }}
      buildStage: Build_And_Sign
      buildJob: Build_And_Sign
      artifactName: drop_packages
      packageDirectory: ${{ parameters.releaseType }}/sdk

  - template: nuget-release.yml
    parameters:
      package: ServerlessProtocol
      title: Serverless Protocol (${{ parameters.releaseType }})
      releaseType: ${{ parameters.releaseType }}
      buildStage: Build_And_Sign
      buildJob: Build_And_Sign
      artifactName: drop_packages
      packageDirectory: ${{ parameters.releaseType }}/serverless
