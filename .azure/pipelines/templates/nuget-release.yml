parameters:
  - name: package
    type: string
  - name: title
    type: string
  - name: buildStage
    type: string
  - name: buildJob
    type: string
  - name: artifactName
    type: string
  - name: packageDirectory
    type: string
  - name: validationSteps
    type: stepList
    default: []

stages:
  # Manual entry stages cannot depend on the build. Enforce it in the publisher.
  - stage: NuGet_${{ parameters.package }}_Release
    displayName: Release ${{ parameters.title }} to NuGet
    trigger: manual
    isSkippable: true
    condition: and(not(canceled()), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    variables:
      ob_release_environment: Test
    jobs:
      - job: Start
        pool:
          type: server
        steps:
          # Run stage is the release decision; no second confirmation is needed.
          - task: Delay@1
            inputs:
              delayForMinutes: '0'

  - stage: NuGet_${{ parameters.package }}_Publish
    displayName: Publish ${{ parameters.title }} to NuGet
    dependsOn:
      - ${{ parameters.buildStage }}
      - NuGet_${{ parameters.package }}_Release
    isSkippable: false
    condition: |
      and(
        succeeded(),
        eq(dependencies.${{ parameters.buildStage }}.result, 'Succeeded'),
        eq(dependencies.NuGet_${{ parameters.package }}_Release.result, 'Succeeded'),
        eq(variables['Build.SourceBranch'], 'refs/heads/dev')
      )
    variables:
      ob_release_environment: Production
    jobs:
      - job: Publish
        condition: and(not(canceled()), eq(variables['buildResult'], 'Succeeded'))
        pool:
          type: release
          os: windows
        variables:
          buildResult: $[ stageDependencies.${{ parameters.buildStage }}.${{ parameters.buildJob }}.result ]
          ob_outputDirectory: $(Build.ArtifactStagingDirectory)
          ob_sdl_codeSignValidation_enabled: false
          ob_sdl_binskim_enabled: false
        templateContext:
          inputs:
            - input: pipelineArtifact
              artifactName: ${{ parameters.artifactName }}
              targetPath: $(Pipeline.Workspace)/nuget-${{ parameters.package }}
        steps:
          - ${{ parameters.validationSteps }}
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $source = '$(Pipeline.Workspace)/nuget-${{ parameters.package }}/${{ parameters.packageDirectory }}'
              $destination = '$(Agent.TempDirectory)/nuget-${{ parameters.package }}'
              $packages = @(Get-ChildItem -LiteralPath $source -Filter '*.nupkg' -File | Where-Object Name -NotLike '*.symbols.nupkg')
              if ($packages.Count -eq 0) { throw 'No release packages found.' }
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              $packages | Copy-Item -Destination $destination
            displayName: Stage release packages for ESRP
          - task: EsrpRelease@14
            displayName: Publish to NuGet.org through ESRP
            inputs:
              ConnectedServiceName: $(ESRP_SERVICE_CONNECTION)
              ClientId: $(ESRP_CLIENT_ID)
              DomainTenantId: $(ESRP_TENANT_ID)
              UseManagedIdentity: true
              KeyVaultName: $(ESRP_KEY_VAULT_NAME)
              SignCertName: $(ESRP_SIGN_CERT_NAME)
              Intent: PackageDistribution
              ContentType: NuGet
              OrganizationName: $(EsrpNuGetOrganization)
              ContentSource: Folder
              FolderLocation: $(Agent.TempDirectory)/nuget-${{ parameters.package }}
              WaitForReleaseCompletion: true
              Owners: $(ESRP_OWNERS)
              Approvers: $(ESRP_APPROVERS)
              ServiceEndpointUrl: https://api.esrp.microsoft.com
              MainPublisher: $(ESRP_MAIN_PUBLISHER)
