name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

parameters:
  - name: emulatorPackageVersion
    displayName: Exact released emulator package version
    type: string

variables:
  - name: EmulatorContainerRepository
    value: signalr/signalr-emulator

resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/dev
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      os: windows
      name: VSEngSS-MicroBuild2022-1ES
    customBuildTags:
      - MigrationTooling-mseng-VSJava-8484-Tool
    sdl:
      eslint:
        enabled: false
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    stages:
      - stage: Publish_Emulator_Image
        displayName: Publish Emulator Image
        lockBehavior: sequential
        jobs:
          - job: Publish_Emulator_Image
            displayName: Publish Emulator Image
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1
                fetchTags: false
              - task: PowerShell@2
                displayName: Validate exact released emulator package
                inputs:
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'
                    $version = "$env:EMULATOR_PACKAGE_VERSION".Trim()
                    if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
                      throw "Emulator package version '$version' is not an exact stable version."
                    }

                    $normalizedVersion = $version.ToLowerInvariant()
                    $packageUri = "https://api.nuget.org/v3-flatcontainer/microsoft.azure.signalr.emulator/$normalizedVersion/microsoft.azure.signalr.emulator.$normalizedVersion.nupkg"
                    $packagePath = Join-Path "$(Agent.TempDirectory)" "Microsoft.Azure.SignalR.Emulator.$version.nupkg"
                    Invoke-WebRequest -UseBasicParsing -Uri $packageUri -OutFile $packagePath
                    if ((Get-Item $packagePath).Length -eq 0) {
                      throw "Downloaded Microsoft.Azure.SignalR.Emulator $version is empty."
                    }

                    Write-Host "Validated released Microsoft.Azure.SignalR.Emulator $version."
                    Write-Host "##vso[task.setvariable variable=EmulatorPackageVersion]$version"
                env:
                  EMULATOR_PACKAGE_VERSION: ${{ parameters.emulatorPackageVersion }}
              - task: AzureCLI@2
                displayName: Publish exact emulator image
                inputs:
                  azureSubscription: $(EmulatorContainerRegistryServiceConnection)
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    $ErrorActionPreference = 'Stop'
                    $version = "$(EmulatorPackageVersion)"
                    $existingTag = az acr repository show-tags `
                      --name "$(EmulatorContainerRegistry)" `
                      --repository "$(EmulatorContainerRepository)" `
                      --query "[?@=='$version'] | [0]" `
                      --output tsv
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to query existing emulator image tags."
                    }
                    if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
                      throw "Image tag $(EmulatorContainerRepository):$version already exists; refusing to overwrite an immutable version tag."
                    }

                    az acr build `
                      --registry "$(EmulatorContainerRegistry)" `
                      --file Dockerfile `
                      --platform linux/amd64 `
                      --image "$(EmulatorContainerRepository):$version" `
                      --image "$(EmulatorContainerRepository):latest" `
                      --build-arg "EMULATOR_VERSION=$version" `
                      src/Microsoft.Azure.SignalR.Emulator
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to build and publish Microsoft.Azure.SignalR.Emulator $version."
                    }

                    az acr repository update `
                      --name "$(EmulatorContainerRegistry)" `
                      --image "$(EmulatorContainerRepository):$version" `
                      --write-enabled false `
                      --delete-enabled false
                    if ($LASTEXITCODE -ne 0) {
                      throw "Published Microsoft.Azure.SignalR.Emulator $version, but failed to lock its version tag."
                    }
