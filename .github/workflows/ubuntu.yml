name: Gated-Ubuntu
on:
 push:
   branches:
    - 'releases/**'
    - dev
 pull_request:
   branches:
    - 'releases/**'
    - dev
jobs:
  build_ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Disable the auto cancelling of all in-progress and queued jobs in the matrix if any job in the matrix fails.
      matrix:
        dotnet-version: [ '8.0.x' ]
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          src:
          - 'src/**'
          - 'test/**'
          - 'build/**'
          - 'samples/**'
          - '*.cmd'
          - '*.ps1'
          - '**.props'
          - '**.csproj'
          - '**.targets'
          - '*.sh'
          - '*.sln'
          emulator:
          - '.dockerignore'
          - 'build/**'
          - 'Directory.Build.props'
          - 'microsoft.png'
          - 'version.props'
          - 'src/Common/MemoryBufferWriter.cs'
          - 'src/Microsoft.Azure.SignalR.Emulator/**'
    - name: Update SubModules
      run: git submodule update --init --recursive
      if: steps.filter.outputs.src == 'true'
    - name: Setup dotnet ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    #  Remove it when .NET 11 is GA.
    - name: Setup .NET 11 daily SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        dotnet-quality: 'daily'
    - name: Display dotnet version
      run: dotnet --version
    - name: Build emulator container
      run: |
        emulator_version="$(dotnet msbuild src/Microsoft.Azure.SignalR.Emulator/Microsoft.Azure.SignalR.Emulator.csproj -nologo -getProperty:VersionPrefix)"
        docker build \
          --build-arg "SOURCE_REVISION=${{ github.sha }}" \
          --build-arg "VERSION=${emulator_version}" \
          --build-arg "VERSION_SUFFIX=rtm" \
          --file src/Microsoft.Azure.SignalR.Emulator/Dockerfile \
          --tag signalr-emulator:ci \
          .
      if: steps.filter.outputs.emulator == 'true'
    - name: Build with dotnet
      run:  "dotnet build AzureSignalR.sln /p:DisableNet461Tests=true"
      if: steps.filter.outputs.src == 'true'
    - name: Test
      run: dotnet test --no-build --logger trx --results-directory "TestResults-ubuntu-${{ matrix.dotnet-version }}"
    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-results-${{ matrix.dotnet-version }}
        path: TestResults-ubuntu-${{ matrix.dotnet-version }}
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}
